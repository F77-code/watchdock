name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        working-directory: watchdock
        run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Lint
        working-directory: watchdock
        run: ruff check config.py main.py core schemas
      - name: Types
        working-directory: watchdock
        run: mypy config.py main.py core schemas
      - name: Test
        working-directory: watchdock
        run: pytest
      - name: Image
        run: docker build -f watchdock/Dockerfile watchdock
