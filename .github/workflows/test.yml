name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: "0.9.28"
      - name: Install
        working-directory: watchdock
        run: uv sync --frozen
      - name: Lint
        working-directory: watchdock
        run: uv run ruff check config.py main.py core schemas
      - name: Types
        working-directory: watchdock
        run: uv run mypy config.py main.py core schemas
      - name: Test
        working-directory: watchdock
        run: uv run pytest
      - name: Image
        run: docker build -f watchdock/Dockerfile watchdock
