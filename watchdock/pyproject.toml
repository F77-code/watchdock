[project]
name = "watchdock"
version = "0.1.0"
description = "Watchdock: сайдкар наблюдения за Docker Compose, триаж инцидента и отчёт в Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.24.0",
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "schemas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
